name: Emulator Smoke Test

# GitHub-এর কম্পিউটারে আসল Android Emulator চালিয়ে অ্যাপ ইনস্টল করে, সেটআপ পার করে,
# সব ট্যাবে ট্যাপ করে এবং ক্র্যাশ হলে লগ দেখায়। ফোন না থাকলেও ক্র্যাশ ধরা যায়।
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # স্ক্রিনশট ci-screenshots ব্রাঞ্চে রাখার জন্য

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # API 29: ছোট স্ক্রিন (পুরোনো, কম দামি ফোনের মতো); API 34: আধুনিক বড় ফোন (Pixel 5)
        include:
          - api-level: 29
            profile: ""
          - api-level: 34
            profile: pixel_5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: KVM চালু (Emulator দ্রুত চালানোর জন্য)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug APK বিল্ড
        run: gradle :app:assembleDebug --console=plain

      - name: Emulator-এ অ্যাপ চালিয়ে পরীক্ষা
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: default
          disable-animations: true
          script: bash tools/emulator_run.sh

      - name: লগ আপলোড
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-api${{ matrix.api-level }}
          path: logcat.txt
          if-no-files-found: ignore

      # শুধু একটি Android সংস্করণের ছবি রাখা হয়; ব্রাঞ্চটি প্রতিবার নতুন করে লেখা হয় (ইতিহাস জমে না)
      - name: স্ক্রিনশট ci-screenshots ব্রাঞ্চে রাখা
        if: always() && matrix.api-level == 34
        run: |
          pwd; ls | head -30
          if [ ! -d screenshots ]; then echo "::warning::screenshots ফোল্ডার নেই"; exit 0; fi
          ls screenshots | wc -l
          cp -r screenshots /tmp/shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-shots
          git rm -rf . -q
          cp -r /tmp/shots/* .
          git add -A
          git commit -q -m "CI স্ক্রিনশট ($GITHUB_SHA)"
          git push -f origin HEAD:ci-screenshots
