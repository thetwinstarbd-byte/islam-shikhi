name: Probe sources (temporary)

# সাময়িক: ডেটা উৎস ও লাইব্রেরির সংস্করণ যাচাই। কাজ শেষে মুছে ফেলা হবে।
on:
  push:
    paths: [".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set +e
          out=""
          add() { out="${out}$1"$'\n'; }

          add "== adhan2 pom license"
          add "$(curl -sS -m 30 https://repo1.maven.org/maven2/com/batoulapps/adhan/adhan2/0.0.7/adhan2-0.0.7.pom | grep -i -E -A3 '<license>' | tr -d ' ' | head -8)"
          add "== adhan2 artifacts"
          add "$(curl -sS -m 30 https://repo1.maven.org/maven2/com/batoulapps/adhan/adhan2/0.0.7/ | grep -o 'href="[^"]*"' | tr '\n' ' ')"
          for id in bn.bengali bn.hoque; do
            add "== tanzil translation header: $id"
            add "$(curl -sS -m 30 https://tanzil.net/trans/$id | grep -E '^#' | head -40)"
            add "lines: $(curl -sS -m 30 https://tanzil.net/trans/$id | grep -c -E '^[0-9]+\|[0-9]+\|')"
          done
          add "== tanzil quran text (uthmani) head/license"
          curl -sS -m 60 -o q.txt "https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=txt-2&agree=true"
          add "bytes: $(wc -c < q.txt) lines: $(grep -c -E '^[0-9]+\|[0-9]+\|' q.txt)"
          add "$(head -c 400 q.txt)"
          add "$(grep -E '^#' q.txt | head -30)"
          add "== tanzil text licence page"
          add "$(curl -sS -m 30 https://tanzil.net/docs/text_license | sed 's/<[^>]*>//g' | tr -s ' \n' | head -c 1800)"
          echo "$out"
          msg=$(echo "$out" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=PROBE::${msg}"
