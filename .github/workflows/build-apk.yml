name: Build Debug APK

# main-এ প্রতিটি push-এ GitHub নিজেই অ্যাপ বিল্ড করে APK বানায়।
# APK পেতে: GitHub রিপোজিটরি > Actions > সর্বশেষ রান > নিচে Artifacts > islam-shikhi-debug-apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # Actions ট্যাব থেকে হাতে চালানোর বাটন

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "ভুল জানান"-এর ঠিকানা ও গোপন কোড (GitHub Secrets); না থাকলে অ্যাপে ফিচারটি 'শীঘ্রই আসছে' দেখায়
      REPORT_URL: ${{ secrets.REPORT_URL }}
      REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
    steps:
      - name: কোড নামানো
        uses: actions/checkout@v4

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar রিপোজিটরিতে নেই, তাই এখানে Gradle 8.9 সরাসরি সেট করা হয়েছে
      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # বিল্ড ব্যর্থ হলে মূল Error লাইনগুলো অ্যানোটেশন হিসেবে দেখানো হয়,
      # যেন লগ খুলে কপি করতে না হয়।
      - name: ভুল জানান সেটআপ আছে কি না (মান দেখানো হয় না)
        run: |
          if [[ "$REPORT_URL" == https://script.google.com/macros/s/* && "$REPORT_URL" == */exec ]]; then echo "::notice title=ভুল জানান::REPORT_URL ঠিক আছে"; else echo "::warning title=ভুল জানান::REPORT_URL নেই বা ভুল (https://script.google.com/macros/s/.../exec হতে হবে)"; fi
          if [ -n "$REPORT_TOKEN" ]; then echo "::notice title=ভুল জানান::REPORT_TOKEN আছে"; else echo "::warning title=ভুল জানান::REPORT_TOKEN নেই"; fi

      - name: Debug APK বিল্ড
        run: |
          set +e
          gradle :app:assembleDebug --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E '^e: |^w: .*Unresolved|error:|What went wrong|Could not |FAILURE|> Task .* FAILED|^> ' build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            tail -n 40 build.log
          fi
          exit $code

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: islam-shikhi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK আপলোডের পরে, যেন পরীক্ষা ব্যর্থ হলেও APK পাওয়া যায়; কিন্তু রান লাল হয়ে জানান দেয়।
      - name: কনটেন্ট নিয়ম যাচাই (সূত্র, আইডি, যাচাই-অবস্থা)
        run: python3 tools/check_content.py

      - name: ইউনিট টেস্ট
        run: gradle :app:testDebugUnitTest --console=plain
